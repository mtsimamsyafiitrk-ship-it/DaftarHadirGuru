<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Aplikasi Daftar Hadir Mengajar/Halaqah">
  <title>Daftar Hadir Mengajar - Pondok Pesantren Al Imam Asy-Syafi'i Tarakan</title>
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="styles/variables.css">
  <link rel="stylesheet" href="styles/theme.css">
  
  <style>
    body { margin: 0; padding: 0; }
  </style>
</head>
<body>
  <!-- HEADER -->
  <header class="header">
    <div class="container">
      <h1>📱 Daftar Hadir Mengajar</h1>
      <p class="text-muted">Pondok Pesantren Al Imam Asy-Syafi'i Tarakan</p>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main style="flex: 1;">
    <!-- LOGIN SCREEN -->
    <div id="screen-login" class="screen active">
      <div class="container">
        <div class="card">
          <h2>🔐 Login</h2>
          
          <div class="form-group">
            <label class="form-label">Username</label>
            <input id="input-username" class="form-input" type="text" placeholder="Masukkan username" autocomplete="off">
          </div>
          
          <div class="form-group">
            <label class="form-label">Password</label>
            <input id="input-password" class="form-input" type="password" placeholder="Masukkan password">
          </div>
          
          <button id="btn-login" class="btn btn-primary btn-block">Login</button>
          
          <div class="text-center mt-lg">
            <p class="text-muted">Belum punya akun? <a href="#" onclick="app.showScreen('register'); return false;">Daftar di sini</a></p>
          </div>
        </div>
      </div>
    </div>

    <!-- REGISTER SCREEN -->
    <div id="screen-register" class="screen">
      <div class="container">
        <div class="card">
          <h2>📝 Registrasi</h2>
          
          <div class="form-group">
            <label class="form-label">Username</label>
            <input id="input-reg-username" class="form-input" type="text" placeholder="Pilih username" autocomplete="off">
          </div>
          
          <div class="form-group">
            <label class="form-label">Email</label>
            <input id="input-reg-email" class="form-input" type="email" placeholder="Masukkan email">
          </div>
          
          <div class="form-group">
            <label class="form-label">Password</label>
            <input id="input-reg-password" class="form-input" type="password" placeholder="Minimal 6 karakter">
          </div>
          
          <button id="btn-register" class="btn btn-primary btn-block">Daftar</button>
          
          <div class="text-center mt-lg">
            <p class="text-muted">Sudah punya akun? <a href="#" onclick="app.showScreen('login'); return false;">Login di sini</a></p>
          </div>
        </div>
      </div>
    </div>

    <!-- DASHBOARD SCREEN -->
    <div id="screen-dashboard" class="screen">
      <div class="container">
        <div class="card">
          <h2>👋 Selamat Datang!</h2>
          <p id="user-greeting" class="text-muted">Memuat data pengguna...</p>
        </div>

        <div class="card">
          <h3>📍 Absensi Hari Ini</h3>
          
          <div class="form-group">
            <label class="form-label">Tanggal</label>
            <input id="attendance-date" class="form-input" type="date" disabled>
          </div>
          
          <div class="form-group">
            <label class="form-label">Status Kehadiran</label>
            <select id="select-attendance" class="form-select">
              <option value="">-- Pilih Status --</option>
              <option value="hadir">✅ Hadir</option>
              <option value="izin">📋 Izin</option>
              <option value="sakit">🏥 Sakit</option>
              <option value="alpa">❌ Alpa</option>
            </select>
          </div>
          
          <button id="btn-attendance" class="btn btn-primary btn-block">Catat Kehadiran</button>
        </div>

        <div class="card">
          <h3>📊 Riwayat Kehadiran</h3>
          <div id="attendance-history" style="max-height: 200px; overflow-y: auto;">
            <p class="text-muted">Memuat riwayat...</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- FOOTER/NAVIGATION -->
  <footer class="footer">
    <div class="container text-center">
      <button id="btn-logout" class="btn btn-secondary">🚪 Logout</button>
      <p class="text-muted mt-md" style="font-size: 12px;">v1.0.0 | Built with ❤️</p>
    </div>
  </footer>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="toast"></div>

  <!-- LOADING OVERLAY -->
  <div id="loading">
    <div class="loader-spinner"></div>
    <div id="loading-msg">Memuat...</div>
  </div>

  <!-- SCRIPTS - Utilities -->
  <script src="scripts/utils/helpers.js"></script>
  <script src="scripts/utils/storage.js"></script>
  <script src="scripts/utils/validators.js"></script>
  <script src="scripts/utils/date-utils.js"></script>

  <!-- SCRIPTS - Services -->
  <script src="scripts/services/auth-service.js"></script>
  <script src="scripts/services/api-service.js"></script>
  <script src="scripts/services/notification-service.js"></script>
  <script src="scripts/services/loader-service.js"></script>

  <!-- SCRIPTS - Configuration & App -->
  <script src="scripts/config.js"></script>
  <script src="scripts/app.js"></script>

  <!-- Initialize app on load -->
  <script>
    // Set today's date in attendance form
    document.addEventListener('DOMContentLoaded', function() {
      const dateInput = document.getElementById('attendance-date');
      if (dateInput) {
        dateInput.value = DateUtils.today();
      }
      
      // Update user greeting
      if (app.currentUser) {
        const greeting = document.getElementById('user-greeting');
        if (greeting) {
          greeting.textContent = `Halo, ${app.currentUser.username}! 👋`;
        }
      }
    });
  </script>
</body>
</html>
